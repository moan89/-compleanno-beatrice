<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">

<!-- META TAG PER L'ANTEPRIMA SU WHATSAPP -->
<meta property="og:title" content="Il compleanno di Beatrice">
<meta property="og:description" content="Una piccola sorpresa prima della festa... Ti aspettiamo!">
<meta property="og:image" content="https://moan89.github.io/-compleanno-beatrice/IMG_0028.jpeg">
<meta property="og:url" content="https://moan89.github.io/-compleanno-beatrice/">
<meta property="og:type" content="website">

<title>Il compleanno di Beatrice</title>
<style>
:root {
  --cream: #fbf8f2; --paper: #fffdf9; --gold: #b88a52; --gold2: #9f7443;
  --brown: #765137; --soft: #eadfce; 
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--cream); color: var(--brown);
  font-family: Georgia, "Times New Roman", serif;
  position: relative;
}
body:before {
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .18;
  background-image: radial-gradient(#b88a52 0.45px, transparent 0.45px);
  background-size: 18px 18px; z-index: -2;
}

/* --- EFFETTO PALLONCINI FLUTTUANTI --- */
.floating-balloons {
  position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden;
}
.float-b {
  position: absolute; bottom: -120px;
  border-radius: 50% 50% 48% 48%; opacity: 0.35; /* Discreti e trasparenti */
  animation: floatUp linear infinite;
}
.float-b:before { /* Il nodino del palloncino */
  content:""; position:absolute; bottom:-4px; left:calc(50% - 3px);
  width:6px; height:6px; background:inherit; transform:rotate(45deg);
}
.float-b:after { /* Il filo */
  content:""; position:absolute; bottom:-30px; left:50%;
  height:30px; border-left:1px solid rgba(118, 81, 55, 0.3);
}
@keyframes floatUp {
  0% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-60vh) rotate(4deg); }
  100% { transform: translateY(-120vh) rotate(-4deg); }
}
/* Colori e posizioni ispirati all'orsetto */
.fb1 { background: #ead8bd; left: 10%; width: 45px; height: 58px; animation-duration: 14s; animation-delay: 0s; }
.fb2 { background: #c8a57a; left: 25%; width: 35px; height: 45px; animation-duration: 18s; animation-delay: 3s; }
.fb3 { background: #8d6445; left: 75%; width: 50px; height: 65px; animation-duration: 15s; animation-delay: 6s; }
.fb4 { background: #efe7d9; left: 85%; width: 40px; height: 52px; animation-duration: 12s; animation-delay: 1s; }
.fb5 { background: #a77a51; left: 50%; width: 55px; height: 72px; animation-duration: 20s; animation-delay: 8s; }
.fb6 { background: #c8a57a; left: 60%; width: 30px; height: 40px; animation-duration: 16s; animation-delay: 12s; }


.screen {
  min-height: 100svh; display: flex; align-items: center; justify-content: center;
  padding: 22px; position: relative; z-index: 10;
}
.card {
  width: min(680px, 100%); background: rgba(255,253,249,.93); /* Leggermente più trasparente per vedere i palloncini sotto */
  border: 1px solid #c6a16e; box-shadow: 0 18px 60px rgba(90,65,40,.12);
  position: relative; overflow: hidden; text-align: center;
  padding-bottom: 20px;
}
.corner { position: absolute; width: 92px; height: 92px; border-color: #b88a52; border-style: solid; opacity: .9; }
.tl { top: 12px; left: 12px; border-width: 1px 0 0 1px; } .tr { top: 12px; right: 12px; border-width: 1px 1px 0 0; }
.bl { bottom: 12px; left: 12px; border-width: 0 0 1px 1px; } .br { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }

.art { width: 100%; display: block; border-bottom: 1px solid var(--soft); margin-bottom: 20px; }

.invite { padding: 10px 26px 20px; }
.place { font-size: 21px; margin-bottom: 4px; } 
.address { font-size: 16px; opacity: .82; }

.buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 24px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 46px;
  padding: 11px 17px; border-radius: 999px; border: 1px solid var(--gold);
  color: #fff; background: var(--gold); text-decoration: none; font-family: inherit; font-size: 15px;
}
.btn.secondary { background: transparent; color: var(--gold2); }
.btn.photo { background: var(--brown); border-color: var(--brown); color: white; width: 100%; max-width: 300px; margin-top: 10px;}

.countdown { margin: 26px auto 26px; padding: 17px; border-top: 1px solid var(--soft); border-bottom: 1px solid var(--soft); }
.countdown strong { display: block; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 8px; }
#timer { font-size: 24px; letter-spacing: .06em; }

/* Stile per il minigioco */
.game-container {
  margin: 20px auto; padding: 20px 10px; background: transparent; 
  border-radius: 8px; border: 1px dashed var(--gold);
  width: min(100%, 340px);
}
.game-title { 
  color: var(--gold); 
  font-family: "Brush Script MT", "Segoe Script", cursive; 
  font-size: 32px; 
  margin-bottom: 10px; 
  line-height: 1;
}
canvas#minigame {
  background: #438B57;
  display: block; margin: 0 auto; border: 3px solid var(--gold2); border-radius: 6px;
  image-rendering: pixelated; width: 100%; height: auto; touch-action: none;
  box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
}
.game-instructions { color: var(--brown); font-family: inherit; font-size: 14px; margin-top: 12px; font-style: italic; }

.footer { font-size: 12px; opacity: .6; margin-top: 18px; }

@media(max-width:430px) {
  .invite { padding: 15px 18px 25px; }
  .buttons .btn { width: 100%; }
}
</style>
</head>
<body>

<!-- Audio Player (Nascosto, parte in automatico al primo tocco) -->
<audio id="bgMusic" loop autoplay>
  <source src="musica.mp3.mp3" type="audio/mpeg">
</audio>

<!-- I Palloncini che fluttuano sullo sfondo -->
<div class="floating-balloons">
  <div class="float-b fb1"></div>
  <div class="float-b fb2"></div>
  <div class="float-b fb3"></div>
  <div class="float-b fb4"></div>
  <div class="float-b fb5"></div>
  <div class="float-b fb6"></div>
</div>

<main class="screen">
  <section class="card">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    
    <img class="art" src="IMG_0028.jpeg" alt="Invito al compleanno di Beatrice">

    <div class="invite" id="invite">
      <div class="place">Circolo Velico Torre di Maremma</div>
      <div class="address">01014 Montalto di Castro VT</div>

      <div class="buttons">
        <a class="btn" target="_blank" rel="noopener"
           href="https://www.google.com/maps/search/?api=1&query=Circolo%20Velico%20Torre%20di%20Maremma%2C%20Montalto%20di%20Castro%20VT">
          📍 Indicazioni
        </a>
        <a class="btn secondary" id="calendarBtn" href="#">📅 Aggiungi al calendario</a>
        <a class="btn secondary" target="_blank" rel="noopener"
           href="https://wa.me/?text=Confermo%20la%20mia%20presenza%20al%20compleanno%20di%20Beatrice%20del%205%20settembre%20alle%2016%3A00.">
          💬 Conferma su WhatsApp
        </a>
        
        <!-- Pulsante per caricare le foto (inserisci qui il link di Google Moduli) -->
        <a class="btn photo" target="_blank" rel="noopener"
           href="https://docs.google.com/forms/d/e/1FAIpQLSeHuxoedHk7jMZyt1jwzBW35Fw8J8rkKwfHJkaQAGolaN7ySQ/viewform?usp=header">
          📸 Carica qui le tue foto!
        </a>
      </div>

      <div class="countdown">
        <strong>Manca poco!</strong>
        <div id="timer">Caricamento…</div>
      </div>

      <!-- Minigioco Retrò (Visuale dall'alto) -->
      <div class="game-container">
        <div class="game-title">Beatrice in the Park</div>
        <canvas id="minigame" width="300" height="250"></canvas>
        <div class="game-instructions">Tocca il prato per muoverti e raccogliere le sorprese!</div>
      </div>

      <div class="footer">Ti aspettiamo per festeggiare insieme 🎈</div>
    </div>
  </section>
</main>

<script>
// Trucco per avviare la musica al primo tocco dello schermo
const bgMusic = document.getElementById('bgMusic');
const startAudio = () => {
  bgMusic.play().catch(e => {}); 
  document.removeEventListener('click', startAudio);
  document.removeEventListener('touchstart', startAudio);
};
document.addEventListener('click', startAudio);
document.addEventListener('touchstart', startAudio);

// Gestione Timer
function updateTimer(){
  const target = new Date('2026-09-05T16:00:00+02:00').getTime();
  const now = Date.now(), diff = target - now;
  const el = document.getElementById('timer');
  if(diff <= 0){ el.textContent = 'È il momento di festeggiare! 🎂'; return; }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor(diff % 86400000 / 3600000);
  const m = Math.floor(diff % 3600000 / 60000);
  const s = Math.floor(diff % 60000 / 1000);
  el.textContent = `${d} giorni · ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
}
updateTimer(); setInterval(updateTimer, 1000);

// Calendario
document.getElementById('calendarBtn').addEventListener('click', e => {
  e.preventDefault();
  const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Invito Beatrice//IT\nBEGIN:VEVENT\nUID:beatrice-20260905@example.local\nDTSTAMP:20260818T100000Z\nDTSTART:20260905T160000\nDTEND:20260905T190000\nSUMMARY:Il compleanno di Beatrice\nLOCATION:Circolo Velico Torre di Maremma, Montalto di Castro VT\nDESCRIPTION:Compleanno di Beatrice\nEND:VEVENT\nEND:VCALENDAR`;
  const blob = new Blob([ics], {type: 'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'Compleanno-Beatrice.ics'; a.click();
  URL.revokeObjectURL(url);
});

// --- Minigioco Retrò ---
const canvas = document.getElementById('minigame');
const ctx = canvas.getContext('2d');

let player = { x: 150, y: 125, speed: 2.5 };
let items = [];
let score = 0;
let keys = {};
let touchTarget = null;

// Caricamento dell'immagine di Beatrice
const playerImg = new Image();
playerImg.src = 'beatrice1.png';

// Genera erba per effetto prato
const grassPatches = [];
for(let i = 0; i < 40; i++) {
  grassPatches.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height
  });
}

// Genera oggetti
function spawnItem() {
  const types = ['🍬', '🎈', '🍰', '🎁'];
  items.push({
    x: 20 + Math.random() * (canvas.width - 40),
    y: 20 + Math.random() * (canvas.height - 40),
    type: types[Math.floor(Math.random() * types.length)]
  });
}
for(let i=0; i<4; i++) spawnItem();

// Controlli Tastiera
window.addEventListener('keydown', e => { keys[e.code] = true; touchTarget = null; });
window.addEventListener('keyup', e => keys[e.code] = false);

// Controlli Touch
canvas.addEventListener('touchstart', handleTouch, {passive: false});
canvas.addEventListener('touchmove', handleTouch, {passive: false});
canvas.addEventListener('touchend', () => touchTarget = null);

function handleTouch(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  touchTarget = {
    x: (e.touches[0].clientX - rect.left) * scaleX,
    y: (e.touches[0].clientY - rect.top) * scaleY
  };
}

function drawGame() {
  // 1. Sfondo Prato
  ctx.fillStyle = '#438B57';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#346d43'; 
  grassPatches.forEach(p => {
    ctx.fillRect(p.x, p.y, 4, 4);
    ctx.fillRect(p.x - 4, p.y + 4, 4, 4);
    ctx.fillRect(p.x + 4, p.y + 4, 4, 4);
  });

  // 2. Movimento
  if(keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
  if(keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
  if(keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
  if(keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;

  if(touchTarget) {
    const dx = touchTarget.x - player.x;
    const dy = touchTarget.y - player.y;
    const distance = Math.sqrt(dx*dx + dy*dy);
    if(distance > player.speed) {
      player.x += (dx / distance) * player.speed;
      player.y += (dy / distance) * player.speed;
    }
  }

  // Limiti bordi
  if(player.x < 15) player.x = 15;
  if(player.x > canvas.width - 15) player.x = canvas.width - 15;
  if(player.y < 15) player.y = 15;
  if(player.y > canvas.height - 15) player.y = canvas.height - 15;

  // 3. Oggetti
  ctx.font = "24px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for(let i = 0; i < items.length; i++) {
    let item = items[i];
    ctx.fillText(item.type, item.x, item.y);

    const dist = Math.sqrt(Math.pow(player.x - item.x, 2) + Math.pow(player.y - item.y, 2));
    if(dist < 30) {
      score += 10;
      items.splice(i, 1);
      spawnItem();
      i--;
    }
  }

  // 4. Disegna Giocatore (Foto o Emoji di backup)
  if(playerImg.complete && playerImg.naturalWidth !== 0) {
    // Foto ingrandita da 34 a 55 pixel!
    ctx.drawImage(playerImg, player.x - 27, player.y - 27, 55, 55);
  } else {
    // Emoji
    ctx.font = "40px Arial";
    ctx.fillText("👧", player.x, player.y);
  }

  // 5. Punteggio
  ctx.fillStyle = "white";
  ctx.font = "16px Georgia";
  ctx.textAlign = "left";
  ctx.fillText("Punti: " + score, 10, 25);

  requestAnimationFrame(drawGame);
}

drawGame();
</script>
</body>
</html>
